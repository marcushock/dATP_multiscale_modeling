# pso_config.yaml
# Configuration for Particle Swarm Optimization of a biophysical model
# Created on 02/24/2025 by MTH 


pso_algorithm:
  n_particles: 5
  n_iterations: 15
  swarm_options: 
    c1: 0.5
    c2: 0.3
    w: 0.9
    k: 2
    p: 2
  velocity_clamping:
    enabled: true
    factor: 0.1  # Limits velocity to 10% of parameter range

files_and_directories: 
  bin_name: '/crucial/modified_MCMC/dATP_multiscale_modeling/bin/MCMC_CUDA_10States'
  exp_data_type: 'ATPase' # Options: 'ATPase', 'Force_pCa'
  # exp_data_file: '/crucial/modified_MCMC/dATP_multiscale_modeling/expData/4_7.csv' 
  # exp_data_file: '/crucial/modified_MCMC/dATP_multiscale_modeling/expData/4.csv' 
  exp_data_file: '/crucial/modified_MCMC/dATP_multiscale_modeling/expData/aficamten_normalized_vehicle.csv'
  default_param_file: '/crucial/modified_MCMC/dATP_multiscale_modeling/parameters/parameter_input.csv'

  
